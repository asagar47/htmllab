<!DOCTYPE html>
<html>

<head>
<title>HTML Live Editor</title>

<!-- CodeMirror CSS -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

<!-- Modes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

<!-- Autocomplete -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    font-family:Segoe UI;
    background:#f1f5f9;
}

/* MAIN WRAPPER */
.wrapper{
    height:100vh;
    padding:20px;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */
.topbar{
    text-align:right;
    margin-bottom:10px;
}

/* BUTTON */
button{
    padding:8px 15px;
    border:none;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    background:#facc15;
}

/* MAIN LAYOUT */
.container{
    flex:1;
    display:flex;
    gap:10px;
    min-height:0;
}

/* PANELS */
.panel{
    flex:1;
    display:flex;
    flex-direction:column;
    background:white;
    border-radius:10px;
    overflow:hidden;
    min-height:0;
}

/* HEADINGS */
.heading{
    padding:10px;
    font-weight:bold;
    background:#e2e8f0;
}

/* EDITOR */
.editor{
    flex:1;
}

.CodeMirror{
    height:100% !important;
    font-size:15px;
}

/* OUTPUT */
.output{
    flex:1;
    min-height:0;
}

.output iframe{
    width:100%;
    height:100%;
    border:none;
    display:block;
}

/* RESIZER */
.resizer{
    width:6px;
    cursor:col-resize;
    background:#94a3b8;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="topbar">
        <button onclick="downloadCode()">⬇ Download</button>
    </div>

    <div class="container">

        <!-- LEFT PANEL -->
        <div class="panel" id="leftPanel">

            <div class="heading">
                💻 HTML Code
            </div>

            <textarea id="code"></textarea>

        </div>

        <!-- RESIZER -->
        <div class="resizer" id="drag"></div>

        <!-- RIGHT PANEL -->
        <div class="panel" id="rightPanel">

            <div class="heading">
                📺 Output
            </div>

            <div class="output">
                <iframe id="output"></iframe>
            </div>

        </div>

    </div>

</div>

<script>

// INIT EDITOR
var editor = CodeMirror.fromTextArea(
document.getElementById("code"),
{
    mode:"htmlmixed",
    lineNumbers:true,
    extraKeys:{
        "Ctrl-Space":"autocomplete"
    }
});

// DEFAULT CODE
editor.setValue(`
<h1>Hello Sagar</h1>

<p>Welcome to Live Editor</p>

<div style="height:1200px;background:lightblue;">
    Scroll Test
</div>
`);

// LIVE PREVIEW
editor.on("change", runCode);

function runCode(){
    document.getElementById("output").srcdoc =
    editor.getValue();
}

// AUTOCOMPLETE
editor.on("inputRead", function(cm, change){

    if(change.text[0] === "<"){
        cm.showHint({
            completeSingle:false
        });
    }

});

// AUTO CLOSE TAGS
editor.on("keyup", function(cm, e){

    if(e.key === ">"){

        let cursor = cm.getCursor();

        let line = cm.getLine(cursor.line);

        let before = line.substring(0, cursor.ch);

        let match = before.match(/<([a-z0-9]+)>$/i);

        if(match){

            let tag = match[1];

            let selfClosing = [
                "img",
                "br",
                "hr",
                "input",
                "meta",
                "link"
            ];

            if(!selfClosing.includes(tag)){

                cm.replaceRange(
                    `</${tag}>`,
                    cursor
                );

                cm.setCursor({
                    line: cursor.line,
                    ch: cursor.ch
                });

            }
        }
    }
});

// DOWNLOAD
function downloadCode(){

    let blob = new Blob(
        [editor.getValue()],
        {type:"text/html"}
    );

    let a = document.createElement("a");

    a.href = URL.createObjectURL(blob);

    a.download = "code.html";

    a.click();
}

// RESIZER
let drag = document.getElementById("drag");

let left = document.getElementById("leftPanel");

let right = document.getElementById("rightPanel");

drag.onmousedown = function(){

    document.onmousemove = function(e){

        let percent =
        (e.clientX / window.innerWidth) * 100;

        left.style.flex =
        "0 0 " + percent + "%";

        right.style.flex =
        "0 0 " + (100 - percent) + "%";
    }

    document.onmouseup = function(){

        document.onmousemove = null;
    }
}

// INIT
runCode();

</script>

</body>
</html>
