<!DOCTYPE html>
<html>
<head>
<title>HTML Live Editor</title>

<style>
body{
  font-family:Segoe UI;
  margin:0;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
  transition:0.3s;
}

body.dark{
  background:#020617;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h2{text-align:center;}

.topbar{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  cursor:pointer;
}

.run{background:#facc15;color:#111;}
.copy{background:#22c55e;color:white;}
.save{background:#3b82f6;color:white;}
.toggle{background:#111;color:white;}

.editor{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:white;
  color:#111827;
  border-radius:15px;
  padding:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

textarea{
  width:100%;
  height:320px;
  border:none;
  outline:none;
  font-family:monospace;
  font-size:15px;
}

iframe{
  width:100%;
  height:320px;
  border:none;
  background:white;
}

.label{font-weight:bold;margin-bottom:8px;}

@media(max-width:700px){
  .editor{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="container">

<h2>💻 HTML Live Code Editor</h2>

<div class="topbar">
<button class="run" onclick="runCode()">▶ Run</button>
<button class="copy" onclick="copyCode()">📋 Copy</button>
<button class="save" onclick="saveCode()">💾 Save</button>
<button class="toggle" onclick="toggleMode()">🌙 Mode</button>
</div>

<div class="editor">

<div class="box">
<div class="label">📝 Write Code</div>
<textarea id="code"></textarea>
</div>

<div class="box">
<div class="label">📺 Output</div>
<iframe id="output"></iframe>
</div>

</div>

</div>

<script>

// Load saved or default code
let defaultCode = `<h1>Hello Students</h1>
<p>Welcome to your live editor</p>`;

document.getElementById("code").value =
localStorage.getItem("savedCode") || defaultCode;

// Auto run on load
runCode();

// Auto-run while typing
document.getElementById("code").addEventListener("input", runCode);

function runCode(){
  let code = document.getElementById("code").value;
  document.getElementById("output").srcdoc = code;
}

function copyCode(){
  let code = document.getElementById("code");
  code.select();
  document.execCommand("copy");
  alert("Code copied!");
}

function saveCode(){
  let code = document.getElementById("code").value;
  localStorage.setItem("savedCode", code);
  alert("Code saved!");
}

function toggleMode(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
