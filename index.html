<!DOCTYPE html>
<html>
<head>
<title>HTML Live Editor</title>

<style>
body{
  font-family:Segoe UI;
  margin:0;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h2{
  text-align:center;
}

.topbar{
  text-align:center;
  margin-bottom:10px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  background:#facc15;
  cursor:pointer;
}

.editor{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:white;
  color:#111827;
  border-radius:15px;
  padding:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

textarea{
  width:100%;
  height:320px;
  border:none;
  outline:none;
  font-family:monospace;
  font-size:15px;
}

iframe{
  width:100%;
  height:320px;
  border:none;
  background:white;
}

.feedback{
  margin-top:10px;
  font-size:14px;
}

.score{
  margin-top:10px;
  font-size:18px;
  font-weight:bold;
}

@media(max-width:700px){
  .editor{
    grid-template-columns:1fr;
  }
}
</style>

</head>

<body>

<div class="container">

<h2>💻 HTML Live Code Editor</h2>

<div class="topbar">
<button onclick="runCode()">▶ Run Code</button>
</div>

<div class="editor">

<div class="box">
<h3>📝 Write Code</h3>

<textarea id="code">
<h1>Hello Students</h1>
<p>Welcome to your live editor</p>
</textarea>

<div class="feedback" id="feedback"></div>
<div class="score" id="score"></div>

</div>

<div class="box">
<h3>📺 Output</h3>
<iframe id="output"></iframe>
</div>

</div>

</div>

<script>

// Auto run on typing
document.getElementById("code").addEventListener("input", runCode);

// Initial run
runCode();

function runCode(){
  let code = document.getElementById("code").value;
  document.getElementById("output").srcdoc = code;

  validate(code);
}

function validate(code){
  let score = 10;
  let errors = [];

  code = code.toLowerCase();

  // Checks
  if(!code.includes("<h1>")){
    errors.push("Missing <h1> tag");
    score -= 2;
  }

  if(!code.includes("</h1>")){
    errors.push("Missing </h1> tag");
    score -= 2;
  }

  if(!code.includes("<p>")){
    errors.push("Missing <p> tag");
    score -= 2;
  }

  if(!code.includes("</p>")){
    errors.push("Missing </p> tag");
    score -= 2;
  }

  if(code.includes("</h2>")){
    errors.push("Wrong closing tag </h2> (use </h1>)");
    score -= 1;
  }

  if(score < 0) score = 0;

  let msg = "";

  if(errors.length === 0){
    msg = "<span style='color:green;font-weight:bold;'>✔ Perfect Code!</span>";
  } else {
    msg = "<span style='color:red;font-weight:bold;'>❌ Errors:</span><br>" + errors.join("<br>");
  }

  document.getElementById("feedback").innerHTML = msg;
  document.getElementById("score").innerHTML = "🎯 Score: " + score + "/10";
}

</script>

</body>
</html>
