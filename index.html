<!DOCTYPE html>
<html>
<head>
<title>Smart HTML Editor</title>

<style>
body{
  font-family:Segoe UI;
  margin:0;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h2{text-align:center;}

.editor{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:white;
  color:#111;
  border-radius:15px;
  padding:15px;
  position:relative;
}

textarea{
  width:100%;
  height:300px;
  font-family:monospace;
  font-size:15px;
  border:none;
  outline:none;
  line-height:1.5;
}

iframe{
  width:100%;
  height:300px;
  border:none;
}

.feedback{
  margin-top:10px;
}

.error{
  color:red;
  font-weight:bold;
}

.suggestion{
  color:#f59e0b;
}

.correct{
  color:green;
}

.score{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

/* Highlight line */
.highlight-line{
  position:absolute;
  left:0;
  right:0;
  height:24px;
  background:rgba(255,0,0,0.15);
  pointer-events:none;
}

@media(max-width:700px){
  .editor{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="container">

<h2>💻 Smart HTML Editor</h2>

<div class="editor">

<div class="box">

<textarea id="code">
<h1>Hello</h1>
<p>Welcome</p>
</textarea>

<div id="highlight" class="highlight-line" style="display:none;"></div>

<div class="feedback" id="feedback"></div>
<div class="score" id="score"></div>

</div>

<div class="box">
<iframe id="output"></iframe>
</div>

</div>

</div>

<script>

let codeBox = document.getElementById("code");

codeBox.addEventListener("input", runCode);

function runCode(){
  let code = codeBox.value;
  document.getElementById("output").srcdoc = code;

  validate(code);
}

function validate(code){
  let msg = "";
  let score = 10;
  let errorLine = -1;

  let lines = code.split("\n");

  // Check each line
  lines.forEach((line, index) => {

    if(line.includes("<h1>") && !line.includes("</h1>")){
      msg += "<div class='error'>❌ Line "+(index+1)+": Missing </h1></div>";
      score -= 2;
      errorLine = index;
    }

    if(line.includes("<p>") && !line.includes("</p>")){
      msg += "<div class='error'>❌ Line "+(index+1)+": Missing </p></div>";
      score -= 2;
      errorLine = index;
    }

    if(line.includes("</h2>")){
      msg += "<div class='suggestion'>⚠️ Line "+(index+1)+": Replace </h2> with </h1></div>";
      score -= 1;
      errorLine = index;
    }

  });

  // Exam validation
  if(code.includes("<h1>") && code.includes("<p>")){
    msg += "<div class='correct'>✔ Good: Heading + Paragraph present</div>";
  } else {
    msg += "<div class='error'>❌ Add both heading and paragraph</div>";
    score -= 2;
  }

  if(score < 0) score = 0;

  document.getElementById("feedback").innerHTML = msg;
  document.getElementById("score").innerHTML = "🎯 Score: " + score + "/10";

  highlightError(errorLine);
}

// Highlight error line visually
function highlightError(lineIndex){
  let highlight = document.getElementById("highlight");

  if(lineIndex === -1){
    highlight.style.display = "none";
    return;
  }

  let lineHeight = 24;
  highlight.style.top = (lineIndex * lineHeight + 10) + "px";
  highlight.style.display = "block";
}

// initial run
runCode();

</script>

</body>
</html>
