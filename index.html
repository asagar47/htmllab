<!DOCTYPE html>
<html>
<head>
<title>HTML Live Editor</title>

<!-- CodeMirror CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

<!-- ✅ Auto close tag addon -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
}

body.light{
  background:#f1f5f9;
  color:#111;
}

.container{
  display:flex;
  height:100vh;
}

.topbar{
  position:fixed;
  top:10px;
  right:20px;
  z-index:10;
}

button{
  margin:5px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  background:#facc15;
}

.editor{
  width:50%;
}

.CodeMirror{
  height:100%;
  font-size:15px;
}

.output{
  width:50%;
  background:white;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}
</style>

</head>

<body>

<div class="topbar">
<button onclick="toggleMode()">🌙 Mode</button>
<button onclick="downloadCode()">⬇ Download</button>
</div>

<div class="container">

<div class="editor">
<textarea id="code"></textarea>
</div>

<div class="output">
<iframe id="output"></iframe>
</div>

</div>

<script>

// Initialize CodeMirror
var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "xml",
  theme: "default",
  lineNumbers: true,
  autoCloseTags: true   // ✅ activates your script
});

// Default code
editor.setValue(`<h1>Hello Sagar</h1>
<p>Welcome to Live Editor</p>`);

// Live preview
editor.on("change", function(){
  runCode();
});

function runCode(){
  document.getElementById("output").srcdoc = editor.getValue();
}

// Dark mode toggle
function toggleMode(){
  document.body.classList.toggle("light");
}

// Download code
function downloadCode(){
  let code = editor.getValue();
  let blob = new Blob([code], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "code.html";
  a.click();
}

// Initial run
runCode();

</script>

</body>
</html>
