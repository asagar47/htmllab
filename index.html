<!DOCTYPE html>
<html>
<head>
<title>HTML Live Editor</title>

<!-- CodeMirror Core -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

<!-- Modes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

<!-- Addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>

<!-- Themes -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#0f172a;
  color:white;
}

.wrapper{
  padding:20px;
  height:100vh;
  box-sizing:border-box;
}

.topbar{
  text-align:right;
  margin-bottom:10px;
}

button, select{
  margin:5px;
  padding:8px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  background:#facc15;
}

.container{
  display:flex;
  height:calc(100% - 50px);
  gap:10px;
}

.panel{
  flex:1;
  display:flex;
  flex-direction:column;
  border-radius:10px;
  overflow:hidden;
}

.heading{
  padding:10px;
  background:#1f2937;
  font-weight:bold;
}

.editor{
  flex:1;
}

.CodeMirror{
  height:100%;
}

.output iframe{
  width:100%;
  height:100%;
  border:none;
  background:white;
}

.resizer{
  width:6px;
  cursor:col-resize;
  background:#64748b;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="topbar">
<button onclick="toggleMode()">🌙 Mode</button>
<button onclick="downloadCode()">⬇ Download</button>

<select onchange="changeTheme(this.value)">
<option value="default">Default</option>
<option value="dracula">Dracula</option>
<option value="monokai">Monokai</option>
</select>
</div>

<div class="container">

<div class="panel" id="leftPanel">
<div class="heading">💻 HTML / JS Code</div>
<textarea id="code"></textarea>
</div>

<div class="resizer" id="drag"></div>

<div class="panel" id="rightPanel">
<div class="heading">📺 Output</div>
<div class="output">
<iframe id="output"></iframe>
</div>
</div>

</div>

</div>

<script>

// INIT EDITOR
var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "htmlmixed",
  lineNumbers: true,
  autoCloseTags: true,
  extraKeys: {"Ctrl-Space": "autocomplete"}
});

// DEFAULT CODE
editor.setValue(`<h1>Hello Sagar</h1>
<p>Welcome to Live Editor</p>`);

// LIVE PREVIEW
editor.on("change", runCode);

function runCode(){
  document.getElementById("output").srcdoc = editor.getValue();
}

// AUTO SUGGEST ON TYPING
editor.on("inputRead", function(cm, change){
  if(change.text[0] === "<"){
    cm.showHint({completeSingle:false});
  }
});

// DARK MODE
function toggleMode(){
  let current = editor.getOption("theme");
  editor.setOption("theme", current === "dracula" ? "default" : "dracula");
}

// THEME SWITCH
function changeTheme(theme){
  editor.setOption("theme", theme);
}

// DOWNLOAD
function downloadCode(){
  let blob = new Blob([editor.getValue()], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "code.html";
  a.click();
}

// RESIZER
let drag = document.getElementById("drag");
let left = document.getElementById("leftPanel");
let right = document.getElementById("rightPanel");

drag.onmousedown = function(){
  document.onmousemove = function(e){
    let percent = (e.clientX / window.innerWidth) * 100;
    left.style.flex = "0 0 " + percent + "%";
    right.style.flex = "0 0 " + (100 - percent) + "%";
  }
  document.onmouseup = function(){
    document.onmousemove = null;
  }
}

// INIT
runCode();

</script>

</body>
</html>
