<!DOCTYPE html>
<html>
<head>
<title>HTML Live Editor</title>

<!-- CodeMirror CSS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

<!-- CodeMirror JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

<!-- Modes -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

<!-- Addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#f1f5f9;
}

.wrapper{
  margin:20px;
  height:90vh;
}

.topbar{
  text-align:right;
  margin-bottom:10px;
}

button{
  padding:8px 15px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
  background:#facc15;
}

/* Layout */
.container{
  display:flex;
  height:calc(100% - 50px);
  gap:10px;
}

.panel{
  flex:1;
  display:flex;
  flex-direction:column;
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.heading{
  padding:10px;
  font-weight:bold;
  background:#e2e8f0;
}

.editor{
  flex:1;
}

.CodeMirror{
  height:100%;
  font-size:15px;
}

/* Output */
.output iframe{
  width:100%;
  height:100%;
  border:none;
}

/* Resizer */
.resizer{
  width:6px;
  cursor:col-resize;
  background:#94a3b8;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="topbar">
<button onclick="downloadCode()">⬇ Download</button>
</div>

<div class="container">

<div class="panel" id="leftPanel">
<div class="heading">💻 HTML Code</div>
<textarea id="code"></textarea>
</div>

<div class="resizer" id="drag"></div>

<div class="panel" id="rightPanel">
<div class="heading">📺 Output</div>
<div class="output">
<iframe id="output"></iframe>
</div>
</div>

</div>

</div>

<script>

// INIT EDITOR
var editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "htmlmixed",
  theme: "default",   // ✅ WHITE BACKGROUND
  lineNumbers: true,

  autoCloseTags: true, // basic support

  extraKeys: {
    "Ctrl-Space": "autocomplete"
  }
});

// DEFAULT CODE
editor.setValue(`<h1>Hello Sagar</h1>
<p>Welcome to Live Editor</p>`);

// LIVE PREVIEW
editor.on("change", runCode);

function runCode(){
  document.getElementById("output").srcdoc = editor.getValue();
}

// ✅ AUTOCOMPLETE
editor.on("inputRead", function(cm, change){
  if(change.text[0] === "<"){
    cm.showHint({completeSingle:false});
  }
});

// ✅ PERFECT CURSOR FIX (IMPORTANT)
editor.on("keyup", function(cm, e){
  if(e.key === ">"){
    let cursor = cm.getCursor();
    let line = cm.getLine(cursor.line);

    let before = line.substring(0, cursor.ch);
    let match = before.match(/<([a-z0-9]+)>$/i);

    if(match){
      let tag = match[1];

      let selfClosing = ["img","br","hr","input","meta","link"];

      if(!selfClosing.includes(tag)){
        cm.replaceRange(`</${tag}>`, cursor);

        // Move cursor BETWEEN tags
        cm.setCursor({line: cursor.line, ch: cursor.ch});
      }
    }
  }
});

// DOWNLOAD
function downloadCode(){
  let blob = new Blob([editor.getValue()], {type:"text/html"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "code.html";
  a.click();
}

// RESIZER
let drag = document.getElementById("drag");
let left = document.getElementById("leftPanel");
let right = document.getElementById("rightPanel");

drag.onmousedown = function(){
  document.onmousemove = function(e){
    let percent = (e.clientX / window.innerWidth) * 100;
    left.style.flex = "0 0 " + percent + "%";
    right.style.flex = "0 0 " + (100 - percent) + "%";
  }
  document.onmouseup = function(){
    document.onmousemove = null;
  }
}

// INIT
runCode();

</script>

</body>
</html>
