<!DOCTYPE html>
<html>
<head>
<title>Smart HTML Editor</title>

<style>
body{
  font-family:Segoe UI;
  margin:0;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h2{text-align:center;}

.editor{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:white;
  color:#111;
  border-radius:15px;
  padding:10px;
  display:flex;
}

/* Line numbers */
.line-numbers{
  background:#f1f5f9;
  padding:10px;
  text-align:right;
  font-family:monospace;
  user-select:none;
}

textarea{
  width:100%;
  height:320px;
  border:none;
  outline:none;
  font-family:monospace;
  font-size:15px;
  padding-left:10px;
  resize:none;
}

iframe{
  width:100%;
  height:340px;
  border:none;
}

.feedback{
  margin-top:10px;
}

.error{
  color:red;
  font-weight:bold;
}

.highlight{
  background:yellow;
}

/* Buttons */
.topbar{
  text-align:center;
  margin-bottom:10px;
}

button{
  padding:10px 20px;
  border:none;
  border-radius:25px;
  font-weight:bold;
  margin:5px;
  cursor:pointer;
}

.run{background:#facc15;}
.fix{background:#22c55e;color:white;}

@media(max-width:700px){
  .editor{grid-template-columns:1fr;}
}
</style>

</head>

<body>

<div class="container">

<h2>💻 Smart HTML Editor</h2>

<div class="topbar">
<button class="run" onclick="runCode()">▶ Run</button>
<button class="fix" onclick="fixError()">🛠 Fix Error</button>
</div>

<div class="editor">

<div>
<div class="box">
<div class="line-numbers" id="lines"></div>
<textarea id="code"></textarea>
</div>
<div class="feedback" id="feedback"></div>
</div>

<div class="box">
<iframe id="output"></iframe>
</div>

</div>

</div>

<script>

let codeBox = document.getElementById("code");

// Default code
codeBox.value = `<h1>Hello</h1>
<p>Welcome</p>`;

// Update line numbers
function updateLines(){
  let lines = codeBox.value.split("\n").length;
  let lineHTML = "";
  for(let i=1;i<=lines;i++){
    lineHTML += i + "<br>";
  }
  document.getElementById("lines").innerHTML = lineHTML;
}

// Scroll sync
codeBox.addEventListener("scroll", () => {
  document.getElementById("lines").scrollTop = codeBox.scrollTop;
});

codeBox.addEventListener("input", () => {
  updateLines();
  runCode();
});

function runCode(){
  let code = codeBox.value;
  document.getElementById("output").srcdoc = code;
  validate(code);
}

let lastErrorLine = -1;

function validate(code){
  let errors = [];
  let lines = code.split("\n");
  lastErrorLine = -1;

  lines.forEach((line, index) => {
    let l = line.toLowerCase();

    if(l.includes("<h1>") && !l.includes("</h1>")){
      errors.push("Line " + (index+1) + ": Missing </h1>");
      lastErrorLine = index;
    }

    if(l.includes("<p>") && !l.includes("</p>")){
      errors.push("Line " + (index+1) + ": Missing </p>");
      lastErrorLine = index;
    }

    if(l.includes("</h2>")){
      errors.push("Line " + (index+1) + ": Wrong tag </h2>");
      lastErrorLine = index;
    }
  });

  let msg = "";

  if(errors.length === 0){
    msg = "<span style='color:green;font-weight:bold;'>✔ Perfect Code</span>";
  } else {
    msg = "<span class='error'>❌ Errors:</span><br>" + errors.join("<br>");
    scrollToError();
  }

  document.getElementById("feedback").innerHTML = msg;
}

// Scroll to error
function scrollToError(){
  if(lastErrorLine === -1) return;

  let lineHeight = 20;
  codeBox.scrollTop = lastErrorLine * lineHeight;
}

// Auto fix
function fixError(){
  let code = codeBox.value;

  code = code.replace("</h2>", "</h1>");

  if(code.includes("<h1>") && !code.includes("</h1>")){
    code += "\n</h1>";
  }

  if(code.includes("<p>") && !code.includes("</p>")){
    code += "\n</p>";
  }

  codeBox.value = code;

  updateLines();
  runCode();
}

// Init
updateLines();
runCode();

</script>

</body>
</html>
